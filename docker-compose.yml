version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: notevault-db
    restart: always
    environment:
      MYSQL_DATABASE: notevault_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: notevault-app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: notevault_db
      DISPLAY: host.docker.internal:0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: bridge

volumes:
  db_data: