# FAQ page Guest
faq.q1 = Mikä on NoteVault?
faq.a1 = NoteVault on turvallinen, hierarkkinen muistiinpanosovellus. Se auttaa järjestämään ajatuksesi muistikirjoihin ja yksittäisiin muistiinpanoihin selkeässä rakenteessa.

faq.q2 = Onko NoteVault ilmainen?
faq.a2 = Kyllä! NoteVault on täysin ilmainen kaikille käyttäjille.

faq.q3 = Tarvitsenko internet-yhteyden?
faq.a3 = Et tarvitse. NoteVault toimii offline-tilassa ja tallentaa tietosi paikallisesti.

faq.q4 = Ovatko tietoni turvassa?
faq.a4 = Kyllä. Kaikki salasanat salataan ja tietosi pysyvät vain omalla laitteellasi.

faq.q5 = Minne tietoni tallennetaan?
faq.a5 = Tietosi tallennetaan paikalliseen MariaDB-tietokantaan laitteellasi.

faq.q6 = Miksi rekisteröityä?
faq.a6 = Rekisteröitymällä saat täyden pysyvyyden, rajattomat muistikirjat ja PDF-viennin.

faq.q7 = Voinko tallentaa muistiinpanoja vieraskäyttäjänä?
faq.a7 = Vieraskäyttäjänä muistiinpanoja ei tallenneta pysyvästi.


#Loggedin FAQ

faq.q8 = Kuinka hallitsen töitäni?
faq.a8 = Voit luoda, lukea, muokata ja poistaa muistiinpanoja sekä järjestää ne muistikirjoihin.

faq.q9 = Miten tunnisteet toimivat?
faq.a9 = Tunnisteet ovat avainsanoja, joilla voit luokitella muistiinpanoja.

faq.q10 = Kuinka hallitsen tunnisteita?
faq.a10 = Voit lisätä tai poistaa tunnisteita luonti- ja muokkausikkunoissa.

faq.q11 = Kuinka muotoilen tekstiä?
faq.a11 = Käytä editorin työkalupalkkia fonttikoon ja listojen hallintaan.

faq.q12 = Kuinka vien muistiinpanot PDF-muotoon?
faq.a12 = Käytä Vie?painiketta editorissa.

faq.q13 = Voinko vaihtaa sovelluksen ulkoasua?
faq.a13 = Kyllä! Voit vaihtaa tumman ja vaalean teeman välillä.

faq.q14 = Mitä sana- ja merkkilaskurit tarkoittavat?
faq.a14 = Ne näyttävät reaaliaikaiset tilastot kirjoittamastasi tekstistä.

faq.q15 = Varmuuskopioidaanko tietoni automaattisesti?
faq.a15 = Ei. Suosittelemme varmuuskopioimaan tietokantatiedoston itse.

faq.q16 = Kuinka hallitsen tiliäni?
faq.a16 = Mene ?Tiliasetukset??osioon Dashboardissa.

faq.close = Sulje

