# Frequently Asked Questions Page
faq.window_title = Usein kysytyt kysymykset

faq.q1=Mikä on NoteVault?
faq.a1=NoteVault on turvallinen muistiinpanosovellus, joka mahdollistaa ajatusten järjestämisen muistikirjoihin ja muistiinpanoihin.

faq.q2=Onko NoteVault ilmainen?
faq.a2=Kyllä! NoteVault on täysin ilmainen kaikille käyttäjille.

faq.q3=Tarvitsenko internetyhteyden?
faq.a3=Et tarvitse. NoteVault toimii paikallisesti tietokoneellasi.

faq.q4=Onko tietoni turvassa?
faq.a4=Kyllä. Salasanat salataan ja tiedot pysyvät laitteellasi.

faq.q5=Missä tietoni tallennetaan?
faq.a5=Tiedot tallennetaan paikalliseen MariaDB-tietokantaan.

faq.q6=Miksi rekisteröityä?
faq.a6=Rekisteröitymällä voit tallentaa muistiinpanosi ja käyttää kaikkia ominaisuuksia.

faq.q7=Voinko tallentaa vieraana?
faq.a7=Et. Vierastilassa muistiinpanoja ei tallenneta.

faq.q8=Miten hallitsen työtäni?
faq.a8=Voit luoda, lukea, muokata ja poistaa muistikirjoja ja muistiinpanoja.

faq.q9=Miten tagit toimivat?
faq.a9=Tagit auttavat luokittelemaan muistiinpanoja.

faq.q10=Miten hallitsen tageja?
faq.a10=Voit lisätä ja poistaa tageja muistiinpanoissa.

faq.q11=Miten muotoilen tekstiä?
faq.a11=Käytä editorin työkalupalkkia.

faq.q12=Miten vien muistiinpanot?
faq.a12=Käytä "Vie PDF" -painiketta.

faq.q13=Voinko muuttaa ulkoasua?
faq.a13=Kyllä, voit vaihtaa teeman asetuksista.

faq.q14=Mitä laskurit tarkoittavat?
faq.a14=Ne näyttävät tekstin pituuden reaaliajassa.

faq.q15=Varmuuskopioidaanko tiedot?
faq.a15=Ei automaattisesti. Suosittelemme varmuuskopiointia.

faq.q16=Miten hallitsen tiliäni?
faq.a16=Siirry tiliasetuksiin hallintapaneelissa.

faq.close=Sulje

