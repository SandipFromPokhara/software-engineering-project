#Frequently Asked Questions Page
faq.window_title = Frequently Asked Questions
# FAQ - Guest
faq.q1=What is NoteVault?
faq.a1=NoteVault is a secure, hierarchical note-taking application. It allows you to organize your thoughts into notebooks and individual notes, all structured within a clean, layered architecture.

faq.q2=Is NoteVault free to use?
faq.a2=Yes! NoteVault is completely free for all users. We believe in providing a distraction-free environment for your thoughts.

faq.q3=Do I need an internet connection to use NoteVault?
faq.a3=No. NoteVault is a desktop application designed for offline use. Your notes are stored locally on your machine, ensuring you can access your work anytime, anywhere.

faq.q4=Is my data secure?
faq.a4=Yes. We prioritize your privacy. All user passwords are encrypted before storage. Because the database is local, your notes never leave your device unless you choose to export them.

faq.q5=Where is my data stored?
faq.a5=Your data is stored locally on your machine in a secure MariaDB database. It never leaves your computer unless you explicitly choose to export or back it up.

faq.q6=Why should I register an account?
faq.a6=Registering unlocks full persistence. You will be able to create unlimited notebooks, save individual notes, use tags for organization, and export your work to PDF.

faq.q7=Can I save my notes as a Guest?
faq.a7=As a guest, you can freely write and experiment, but your notes will not be saved. To preserve your work, please register an account.

# FAQ - Logged-in user
faq.q8=How do I manage my work?
faq.a8=You have full Create, Read, Edit, and Delete control. You can create multiple notebooks, organize notes within them, and use tags to cross-reference your ideas.

faq.q9=How does the tagging system work?
faq.a9=Tags are keywords that help you categorize notes. Simply type your tag in the combo box and click "Add tags." You can then view notes by these tags in the Dashboard.

faq.q10=How do I manage tags?
faq.a10=You can add or remove tags in the Create or Edit Note window.

faq.q11=How do I format my text?
faq.a11=Use the toolbar above the editor area. You can increase or decrease font sizes and create bulleted or numbered lists. Changes are applied to the whole text.

faq.q12=How do I export my notes?
faq.a12=In the editor, use the "Export" button to convert your notes into PDF format, making it easy to share your work or print it.

faq.q13=Can I change the look of the app?
faq.a13=Yes! You can toggle between Dark and Light themes via the settings menu in the Dashboard to suit your environment.

faq.q14=What do the word/character counters mean?
faq.a14=The status bar shows real-time stats for the note you are currently writing or editing, perfect for keeping track of essay lengths or quick memos.

faq.q15=Is my data automatically backed up?
faq.a15=Since NoteVault is a local application, it does not automatically sync to the cloud. We highly recommend occasionally copying your database file to an external drive or cloud service for safety.

faq.q16=How do I manage my account?
faq.a16=Navigate to the "Account Settings" section in the Dashboard to update your profile or manage your session.

