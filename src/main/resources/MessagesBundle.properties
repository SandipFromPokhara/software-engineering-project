########################################
# Frequently Asked Questions (FAQ)
########################################
faq.window_title=Frequently Asked Questions
# --- Guest FAQ ---
faq.q1=What is NoteVault?
faq.a1=NoteVault is a secure, hierarchical note-taking application. It allows you to organize your thoughts into notebooks and individual notes in a structured way.
faq.q2=Is NoteVault free to use?
faq.a2=Yes! NoteVault is completely free for all users.
faq.q3=Do I need an internet connection?
faq.a3=No. NoteVault works offline and stores data locally on your device.
faq.q4=Is my data secure?
faq.a4=Yes. Passwords are encrypted and your data stays on your device.
faq.q5=Where is my data stored?
faq.a5=Data is stored locally in a MariaDB database on your machine.
faq.q6=Why should I register?
faq.a6=Registering allows you to save notes, organize notebooks, use tags, and export content.
faq.q7=Can guests save notes?
faq.a7=No. Guest notes are temporary and will not be saved.
# --- Logged-in FAQ ---
faq.q8=How do I manage my work?
faq.a8=You can create, edit, delete, and organize notes across multiple notebooks.
faq.q9=How does tagging work?
faq.a9=Tags help categorize notes. Add them via the tag field and filter notes easily.
faq.q10=How do I manage tags?
faq.a10=Tags can be added or removed while creating or editing notes.
faq.q11=How do I format text?
faq.a11=Use the toolbar to adjust font size and create lists.
faq.q12=How do I export notes?
faq.a12=Use the Export button to save notes as PDF files.
faq.q13=Can I change the theme?
faq.a13=Yes, switch between light and dark modes in settings.
faq.q14=What do word/character counters show?
faq.a14=They display real-time statistics of your note.
faq.q15=Is data automatically backed up?
faq.a15=No. You should manually back up your database file.
faq.q16=How do I manage my account?
faq.a16=Use the Account Settings section in the dashboard.
faq.close=Close
