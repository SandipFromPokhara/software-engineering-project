faq.a4 = \u0628\u0644\u0647. \u0645\u0627 \u062D\u0631\u06CC\u0645 \u062E\u0635\u0648\u0635\u06CC \u0634\u0645\u0627 \u0631\u0627 \u062F\u0631 \u0627\u0648\u0644\u0648\u06CC\u062A \u0642\u0631\u0627\u0631 \u0645\u06CC\u200C\u062F\u0647\u06CC\u0645. \u062A\u0645\u0627\u0645 \u0631\u0645\u0632\u0647\u0627\u06CC \u0639\u0628\u0648\u0631 \u067E\u06CC\u0634 \u0627\u0632 \u0630\u062E\u06CC\u0631\u0647\u200C\u0633\u0627\u0632\u06CC \u0631\u0645\u0632\u0646\u06AF\u0627\u0631\u06CC \u0645\u06CC\u200C\u0634\u0648\u0646\u062F \u0648 \u0686\u0648\u0646 \u067E\u0627\u06CC\u06AF\u0627\u0647 \u062F\u0627\u062F\u0647 \u0645\u062D\u0644\u06CC \u0627\u0633\u062A\u060C \u06CC\u0627\u062F\u062F\u0627\u0634\u062A\u200C\u0647\u0627 \u0628\u062F\u0648\u0646 \u0627\u0646\u062A\u062E\u0627\u0628 \u0634\u0645\u0627 \u0627\u0632 \u062F\u0633\u062A\u06AF\u0627\u0647 \u062E\u0627\u0631\u062C \u0646\u0645\u06CC\u200C\u0634\u0648\u0646\u062F.
