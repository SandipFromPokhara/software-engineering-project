########################################
# Frequently Asked Questions (FAQ)
########################################
faq.window_title = Usein kysytyt kysymykset
# --- Guest FAQ ---
faq.q1 = Mik\u00E4 on NoteVault?
faq.a1 = NoteVault on turvallinen, hierarkkinen muistiinpanosovellus. Sen avulla voit j\u00E4rjest\u00E4\u00E4 ajatuksesi muistikirjoihin ja yksitt\u00E4isiin muistiinpanoihin, kaikki selke\u00E4sti kerrostetussa rakenteessa.
faq.q2 = Onko NoteVault ilmainen?
faq.a2 = Kyll\u00E4! NoteVault on t\u00E4ysin ilmainen kaikille k\u00E4ytt\u00E4jille. Uskomme, ett\u00E4 ajatuksillesi kuuluu h\u00E4iri\u00F6t\u00F6n ymp\u00E4rist\u00F6.
faq.q3 = Tarvitsenko internet-yhteyden k\u00E4ytt\u00E4\u00E4kseni NoteVaultia?
faq.a3 = Ei. NoteVault on ty\u00F6p\u00F6yt\u00E4sovellus, joka on suunniteltu k\u00E4ytett\u00E4v\u00E4ksi offline-tilassa. Muistiinpanosi tallennetaan paikallisesti laitteellesi, joten voit k\u00E4ytt\u00E4\u00E4 niit\u00E4 milloin tahansa.
faq.q4 = Ovatko tietoni turvassa?
faq.a4 = Kyll\u00E4. Asetamme yksityisyytesi etusijalle. Kaikki k\u00E4ytt\u00E4jien salasanat salataan ennen tallennusta. Koska tietokanta on paikallinen, muistiinpanosi eiv\u00E4t koskaan poistu laitteeltasi, ellet itse p\u00E4\u00E4t\u00E4 jakaa niit\u00E4.
faq.q5 = Miss\u00E4 tietoni tallennetaan?
faq.a5 = Tietosi tallennetaan paikallisesti laitteellesi turvalliseen MariaDB-tietokantaan. Ne eiv\u00E4t koskaan poistu tietokoneeltasi, ellet erikseen p\u00E4\u00E4t\u00E4 vied\u00E4 tai varmuuskopioida niit\u00E4.
faq.q6 = Miksi minun pit\u00E4isi rekister\u00F6id\u00E4 tili?
faq.a6 = Rekister\u00F6ityminen avaa t\u00E4yden tallennustoiminnallisuuden. Voit luoda rajattomasti muistikirjoja, tallentaa yksitt\u00E4isi\u00E4 muistiinpanoja, k\u00E4ytt\u00E4\u00E4 tageja j\u00E4rjestelyyn ja vied\u00E4 ty\u00F6si PDF-muotoon.
faq.q7 = Voinko tallentaa muistiinpanojani vieraana?
faq.a7 = Vieraana voit kirjoittaa ja kokeilla vapaasti, mutta muistiinpanojasi ei tallenneta. S\u00E4ilytt\u00E4\u00E4ksesi ty\u00F6si, rekister\u00F6i k\u00E4ytt\u00E4j\u00E4tili.

# --- Logged-in FAQ ---
faq.q8 = Kuinka voin hallita muistiinpanojani NoteVaultissa?
faq.a8 = Voit luoda, muokata, poistaa ja j\u00E4rjest\u00E4\u00E4 muistiinpanoja.
faq.q9 = Miten tunnisteet toimivat?
faq.a9 = Tunnisteet auttavat luokittelemaan muistiinpanoja. Lis\u00E4\u00E4 ne tag-kentt\u00E4\u00E4n ja suodata muistiinpanot helposti.
faq.q10 = Miten hallitsen tunnisteita?
faq.a10 = Tageja voidaan lis\u00E4t\u00E4 tai poistaa muistiinpanoja luodessa tai muokattaessa.
faq.q11 = Miten muotoilen teksti\u00E4?
faq.a11 = K\u00E4yt\u00E4 ty\u00F6kalupalkkia s\u00E4\u00E4t\u00E4\u00E4ksesi fontin kokoa ja luodaksesi listoja.
faq.q12 = Miten vien muistiinpanoja?
faq.a12 = K\u00E4yt\u00E4 vientipainiketta tallentaaksesi PDF-muotoon.
faq.q13 = Voinko vaihtaa teeman?
faq.a13 = Kyll\u00E4, voit vaihtaa vaalean ja tumman teeman v\u00E4lill\u00E4.
faq.q14 = Mit\u00E4 sanam\u00E4\u00E4r\u00E4/merkkim\u00E4\u00E4r\u00E4 n\u00E4ytt\u00E4\u00E4?
faq.a14 = Se n\u00E4ytt\u00E4\u00E4 muistiinpanon reaaliaikaiset tilastot.
faq.q15 = Varmuuskopioidaanko tiedot automaattisesti?
faq.a15 = Ei. Suosittelemme varmuuskopiointia itse.
faq.q16 = Miten hallitsen tili\u00E4ni?
faq.a16 = Valitse hallintapaneelin ikkunasta vaihtoehdoista 'Hallitse tili\u00E4' tai 'Poista tili'.
faq.close = Sulje

