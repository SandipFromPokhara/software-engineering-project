about.content = Yksinkertainen sovellus muistikirjojen ja muistiinpanojen hallintaan.\n\nKehittäjät:\n  Dinal Maha Vidanelage\n  Sandip Ranjit\n  Swostika Lama\n  Twe He Gam\n\nOhjelmistotekniikan DevOps-projekti 2026\nMetropolia Ammattikorkeakoulu\n\nTeknologiat:\n  Docker, Java, JavaFX, JPA (Hibernate), JUnit 5\n  Jenkins, Kubernetes, MariaDB