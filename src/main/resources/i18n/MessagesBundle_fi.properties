########################################
# Frequently Asked Questions (FAQ)
########################################
faq.window_title = Usein kysytyt kysymykset

# --- Guest FAQ ---
faq.q1 = Mik\u00E4 on NoteVault?
faq.a1 = NoteVault on turvallinen muistiinpanosovellus, jossa voit j\u00E4rjest\u00E4\u00E4 ajatuksesi muistikirjoihin ja muistiinpanoihin.
faq.q2 = Onko NoteVault ilmainen?
faq.a2 = Kyll\u00E4! NoteVault on t\u00E4ysin ilmainen kaikille k\u00E4ytt\u00E4jille.
faq.q3 = Tarvitsenko internetyhteyden?
faq.a3 = Et. NoteVault toimii offline-tilassa ja tallentaa tiedot paikallisesti.
faq.q4 = Onko tietoni turvassa?
faq.a4 = Kyll\u00E4. Salasanat salataan ja tietosi pysyv\u00E4t laitteellasi.
faq.q5 = Miss\u00E4 tietoni tallennetaan?
faq.a5 = Tiedot tallennetaan paikalliseen MariaDB-tietokantaan.
faq.q6 = Miksi rekister\u00F6ity\u00E4?
faq.a6 = Rekister\u00F6ityminen mahdollistaa muistiinpanojen tallennuksen, j\u00E4rjestelyn ja viennin.
faq.q7 = Voinko tallentaa vieraana?
faq.a7 = Et. Vierastilassa muistiinpanoja ei tallenneta.

# --- Logged-in FAQ ---
faq.q8 = Miten hallitsen muistiinpanojani NoteVaultissa?
faq.a8 = Voit luoda, muokata, poistaa ja j\u00E4rjest\u00E4\u00E4 muistiinpanoja.
faq.q9 = Miten tunnisteet toimivat?
faq.a9 = Tunnisteet auttavat luokittelemaan muistiinpanoja.
faq.q10 = Miten hallitsen tunnisteita?
faq.a10 = Voit lis\u00E4t\u00E4 tai poistaa niit\u00E4 muistiinpanoa luodessa tai muokatessa.
faq.q11 = Miten muotoilen teksti\u00E4?
faq.a11 = K\u00E4yt\u00E4 ty\u00F6kalupalkkia tekstin muotoiluun.
faq.q12 = Miten vien muistiinpanoja?
faq.a12 = K\u00E4yt\u00E4 vientipainiketta tallentaaksesi PDF-muotoon.
faq.q13 = Voinko vaihtaa teemaa?
faq.a13 = Kyll\u00E4, voit vaihtaa vaalean ja tumman teeman v\u00E4lill\u00E4.
faq.q14 = Mit\u00E4 sana-/merkkilaskuri n\u00E4ytt\u00E4\u00E4?
faq.a14 = Se n\u00E4ytt\u00E4\u00E4 muistiinpanon reaaliaikaiset tilastot.
faq.q15 = Varmuuskopioidaanko tiedot automaattisesti?
faq.a15 = Ei. Suosittelemme varmuuskopiointia itse.
faq.q16 = Miten hallitsen tili\u00E4ni?
faq.a16 = Siirry tiliasetuksiin hallitaksesi tili\u00E4si.
faq.close = Sulje

