########################################
# Frequently Asked Questions (FAQ)
########################################
faq.window_title = Usein kysytyt kysymykset

# --- Guest FAQ ---
faq.q1 = Mikä on NoteVault?
faq.a1 = NoteVault on turvallinen muistiinpanosovellus, jossa voit järjestää ajatuksesi muistikirjoihin ja muistiinpanoihin.

faq.q2 = Onko NoteVault ilmainen?
faq.a2 = Kyllä! NoteVault on täysin ilmainen kaikille käyttäjille.

faq.q3 = Tarvitsenko internetyhteyden?
faq.a3 = Et. NoteVault toimii offline-tilassa ja tallentaa tiedot paikallisesti.

faq.q4 = Onko tietoni turvassa?
faq.a4 = Kyllä. Salasanat salataan ja tietosi pysyvät laitteellasi.

faq.q5 = Missä tietoni tallennetaan?
faq.a5 = Tiedot tallennetaan paikalliseen MariaDB-tietokantaan.

faq.q6 = Miksi rekisteröityä?
faq.a6 = Rekisteröityminen mahdollistaa muistiinpanojen tallennuksen, järjestelyn ja viennin.

faq.q7 = Voinko tallentaa vieraana?
faq.a7 = Et. Vierastilassa muistiinpanoja ei tallenneta.

# --- Logged-in FAQ ---
faq.q8 = Miten hallitsen sisältöäni?
faq.a8 = Voit luoda, muokata, poistaa ja järjestää muistiinpanoja.

faq.q9 = Miten tunnisteet toimivat?
faq.a9 = Tunnisteet auttavat luokittelemaan muistiinpanoja.

faq.q10 = Miten hallitsen tunnisteita?
faq.a10 = Voit lisätä tai poistaa niitä muistiinpanoa luodessa tai muokatessa.

faq.q11 = Miten muotoilen tekstiä?
faq.a11 = Käytä työkalupalkkia tekstin muotoiluun.

faq.q12 = Miten vien muistiinpanoja?
faq.a12 = Käytä vientipainiketta tallentaaksesi PDF-muotoon.

faq.q13 = Voinko vaihtaa teemaa?
faq.a13 = Kyllä, voit vaihtaa vaalean ja tumman teeman välillä.

faq.q14 = Mitä sana-/merkkilaskuri näyttää?
faq.a14 = Se näyttää muistiinpanon reaaliaikaiset tilastot.

faq.q15 = Varmuuskopioidaanko tiedot automaattisesti?
faq.a15 = Ei. Suosittelemme varmuuskopiointia itse.

faq.q16 = Miten hallitsen tiliäni?
faq.a16 = Siirry tiliasetuksiin hallitaksesi tiliäsi.

faq.close = Sulje

