########################################
# Frequently Asked Questions (FAQ)
########################################
faq.window_title = Frequently Asked Questions
# --- Guest FAQ ---
faq.q1 = What is NoteVault?
faq.a1 = NoteVault is a secure, hierarchical note-taking application. It allows you to organize your thoughts into notebooks and individual notes, all structured within a clean, layered architecture.
faq.q2 = Is NoteVault free to use?
faq.a2 = Yes! NoteVault is completely free for all users. We believe in providing a distraction-free environment for your thoughts.
faq.q3 = Do I need an internet connection to use NoteVault?
faq.a3 = No. NoteVault is a desktop application designed for offline use. Your notes are stored locally on your machine, ensuring you can access your work anytime, anywhere.
faq.q4 = Is my data secure?
faq.a4 = Yes. We prioritize your privacy. All user passwords are encrypted before storage. Because the database is local, your notes never leave your device unless you choose to export them.
faq.q5 = Where is my data stored?
faq.a5 = Your data is stored locally on your machine in a secure MariaDB database. It never leaves your computer unless you explicitly choose to export back it up.
faq.q6 = Why should I register an account?
faq.a6 = Registering unlocks full persistence. You will be able to create unlimited notebooks, save individual notes, use tags for organization, and export your work to PDF.
faq.q7 = Can I save my notes as a Guest?
faq.a7 = As a guest, you can freely write and experiment, but your notes will not be saved. To preserve your work, please register an account.

# --- Logged-in FAQ ---
faq.q8 = How can I manage my notes in NoteVault?
faq.a8 = You can create, edit, delete, and organize notes across multiple notebooks.
faq.q9 = How does tagging work?
faq.a9 = Tags help categorize notes. Add them via the tag field and filter notes easily.
faq.q10 = How do I manage tags?
faq.a10 = Tags can be added or removed while creating or editing notes.
faq.q11 = How do I format text?
faq.a11 = Use the toolbar to adjust font size and create lists.
faq.q12 = How do I export notes?
faq.a12 = Use the 'Export as PDF' button to save notes as PDF files.
faq.q13 = Can I change the theme?
faq.a13 = Yes, switch between light and dark modes by clicking the half-moon or sun icon.
faq.q14 = What do word/character counts show?
faq.a14 = They display real-time statistics of your note.
faq.q15 = Is data automatically backed up?
faq.a15 = No. You should manually back up your database file.
faq.q16 = How can I manage my NoteVault account?
faq.a16 = Choose 'Manage Account' or 'Delete Account' from options in the dashboard window.
faq.close = Close

