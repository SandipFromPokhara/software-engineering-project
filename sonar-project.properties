# must be unique in a given SonarQube Server instance
sonar.projectKey=NoteVault

# --- optional properties ---

# defaults to project key
sonar.projectName=NoteVault_SEP_project

# defaults to 'not provided'
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=src
sonar.java.binaries=target/classes
sonar.host.url=http://localhost:9000

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# run with:
mvn clean verify sonar:sonar "-Dsonar.projectKey=NoteVault" "-Dsonar.token=$env:SONAR_TOKEN" "-Dsonar.host.url=http://localhost:9000"