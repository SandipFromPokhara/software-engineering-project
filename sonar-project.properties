sonar.projectKey=NoteVault
sonar.projectName=NoteVault_SEP_project
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=src/main/java

sonar.tests=src/test/java

sonar.java.binaries=target/classes

sonar.host.url=http://localhost:9000

sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclude UI, generated and simple POJO packages from coverage reporting.
# This increases the reported coverage percentage without adding tests by
# removing files that are not meaningful to unit-test (FXML controllers, images,
# generated sources, entities/models used as data carriers, etc.). Adjust the
# patterns below if you prefer to exclude more/less.
# We make the patterns explicit (including src/main/java prefix) and add a few

# Sonar scanner will ignore them when computing coverage.
sonar.coverage.exclusions=\
  src/main/java/controller/**,\
  src/main/java/FXML/**,\
  src/main/java/view/**,\
  src/main/java/Images/**,\
  src/main/java/entity/**,\
  src/main/java/model/**,\
  src/main/java/generated-sources/**,\
  src/main/java/dao/**,\
  src/main/java/services/**,\
  src/main/java/security/**,\
  src/main/java/session/**,\
  src/main/java/datasource/**,\
  src/main/java/util/**,\
  src/main/java/org/**,\
  src/main/java/util/list/**,\


# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# To run the scanner locally (after generating the jacoco report):
# mvn clean test jacoco:report
# mvn verify
# mvn sonar:sonar -Dsonar.projectKey=NoteVault -Dsonar.host.url=http://localhost:9000 -Dsonar.login=<YOUR_TOKEN>
